# The storage core and the platform crates it calls, each in `crates/`, sharing these lints. A later
# backend lands beside them as `crates/keystore-<backend>`.
[workspace]
resolver = "3"
members = [
    "crates/keystore",
    "crates/keystore-enclave",
]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
unused_must_use = "deny"
# Allowed back per-file, and only on the one `geteuid` call in `crates/keystore/src/uid.rs`, so the
# next `unsafe` anywhere in the workspace has to be argued rather than merely written.
unsafe_code = "deny"
