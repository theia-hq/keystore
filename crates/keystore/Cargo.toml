[package]
publish = false  # git-only for now, not published to crates.io
name = "keystore"
description = "One ed25519 secret key in one file, plain or sealed under a passphrase or `touch-id`."
version = "0.1.0"
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false }
# `hazmat` for the expanded secret key: the public half of a seed without building a signing key,
# since nothing here signs.
ed25519-dalek = { version = "2", features = ["hazmat"] }
getrandom = "0.4"
icu_normalizer = { version = "2.1", default-features = false, features = ["compiled_data"] }
thiserror = "2"
zeroize = "1"

# The `touch-id` lock opens only on a Mac. Elsewhere a build parses and names the lock and leaves it
# alone, so none of this is compiled there.
[target.'cfg(target_os = "macos")'.dependencies]
hkdf = "0.12"
keystore-enclave = { path = "../keystore-enclave" }
p256 = { version = "0.13", default-features = false, features = ["ecdh"] }
sha2 = { version = "0.10", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The software stand-in for the enclave, which runs the `touch-id` lock's every byte on any machine.
[dev-dependencies]
hkdf = "0.12"
p256 = { version = "0.13", default-features = false, features = ["ecdh"] }
sha2 = { version = "0.10", default-features = false }

[lints]
workspace = true
