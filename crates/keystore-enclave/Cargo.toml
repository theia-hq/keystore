[package]
publish = false  # git-only for now, not published to crates.io
name = "keystore-enclave"
description = "A Secure Enclave P-256 key, stored as a blob you keep, that does ECDH after a touch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Every dependency is macOS's own: the crate is empty on any other target, so it costs a non-Mac build
# nothing.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework-sys = "2.17"
thiserror = "2"
zeroize = "1"

[lints]
workspace = true
